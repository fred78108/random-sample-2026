[project]
name = "random-sample"
version = "0.1.0"
description = "2026 season experiment: AI model for Yahoo Pro Pick'em"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.0",
    "langgraph>=1.0.0",
    "langchain-ollama>=1.0.0",
    "typer>=0.27.0",
    "matplotlib>=3.11.0",
    "rich>=15.0.0",
]

[project.scripts]
pickem = "random_sample.pickem.cli:app"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/random_sample"]

[tool.ruff]
line-length = 100
